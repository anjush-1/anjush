<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Message Viewer</title>
</head>
<body>

    <h1>Message</h1>

    <p id="message">aHR0cHM6Ly94LmNvbS9TcDFyaXRGeXJl</p>

    <button onclick="decodeMessage()">Reveal Message</button>

    <script>
        function decodeMessage() {
            const encoded = "aHR0cHM6Ly94LmNvbS9TcDFyaXRGeXJl";
            const decoded = atob(encoded);
            document.getElementById("message").innerText = decoded;
        }
    </script>

</body>
</html>
